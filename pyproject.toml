[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmc"
version = "0.0.0"
description = "Tensor network VMC package"
requires-python = ">=3.11"
dependencies = [
  "flax>=0.10.2",
  "netket>=3.21.0",
  "numpy>=2.0.2",
  "scipy>=1.14.1",
  "plum-dispatch>=2.5.4",
  "tqdm>=4.67.1",
  "matplotlib>=3.10.8",
]

[project.optional-dependencies]
cpu = ["jax"]
cuda = ["jax[cuda13]"]

[dependency-groups]
dev = [
    "imageio>=2.37.3",
    "mcp>=1.26.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_physics_models.py"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
